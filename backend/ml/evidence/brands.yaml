# Hand-curated brand facts. Every claim needs a `url` that a teammate opened and checked (`verified_by`).
# A row with no working URL is dropped, not guessed. Brand names match listings case- and punctuation-insensitively,
# via `name` and `aliases`.
#
# - name: Patagonia
#   aliases: [patagonia inc]
#   repair_program: {value: "Worn Wear repairs", url: "https://..."}
#   guarantee:      {value: "Ironclad Guarantee", url: "https://..."}
#   certifications: [{name: fair_trade, url: "https://..."}]
#   as_of: 2026-10-24
#   verified_by: Haram
#
# bluesign rows cite bluesign's own "System Partner list (Brands)" PDF dated September 1, 2026: each name below
# appears there as its own line (e.g. "PATAGONIA USA").
# Rule (2026-10-24): only promises that reach a secondhand buyer count. Time-limited guarantees for the original buyer
# (Nike 2-year warranty, Smartwool 2-year, KUHL 18-month, L.L.Bean 1-year satisfaction) were sourced but left out: they
# almost never apply to a resold item, and a guarantee here adds +2 quality to every item of the brand.
# Carhartt is missing because carhartt.com blocks automated fetches: add its row by hand (tests/test_brands.py).
brands:
  - name: Patagonia
    aliases: [patagonia inc]
    # "Customers can return items to the store you bought it from or to Patagonia for a repair, replacement, or refund." /
    # "submit a repair assessment" (fetched 2026-10-24)
    repair_program: {value: "Repairs gear via repair assessment", url: "https://www.patagonia.com.au/pages/ironclad-guarantee"}
    # "We guarantee everything we make." (fetched 2026-10-24)
    guarantee: {value: "Ironclad Guarantee on everything it makes", url: "https://www.patagonia.com.au/pages/ironclad-guarantee"}
    certifications:
      # "PATAGONIA USA" (fetched 2026-10-24)
      - {name: bluesign, url: "https://www.bluesign.com/wp-content/uploads/2026/09/bluesign-System-Partner-list-Brands_2026.09.01.pdf"}
    as_of: 2026-10-24
    verified_by: "agent-sourced, needs teammate check"

  - name: The North Face
    aliases: [tnf, north face, the north face vintage]
    certifications:
      # "THE NORTH FACE USA" (fetched 2026-10-24)
      - {name: bluesign, url: "https://www.bluesign.com/wp-content/uploads/2026/09/bluesign-System-Partner-list-Brands_2026.09.01.pdf"}
    as_of: 2026-10-24
    verified_by: "agent-sourced, needs teammate check"

  - name: Levi's
    aliases: [levi strauss, levi strauss co]
    # "Today, the Levi's® Tailor Shop continues that legacy through customization, alteration and repair." (fetched 2026-10-24)
    repair_program: {value: "Levi's Tailor Shop repairs", url: "https://www.levi.com/US/en_US/features/tailor-shop"}
    as_of: 2026-10-24
    verified_by: "agent-sourced, needs teammate check"

  - name: Arc'teryx
    aliases: [arcteryx veilance]
    # "Through our ReBIRD™ program, we will repair your gear for as long as it is repairable." (fetched 2026-10-24)
    repair_program: {value: "ReBIRD repairs gear while repairable", url: "https://arcteryx.com/us/en/rebird/repair"}
    # "warrants the following Arc'teryx products against non-conformance with Arc'teryx material and workmanship
    # specifications" ... apparel, packs and accessories: "Practical Product Lifespan" (fetched 2026-10-24)
    guarantee: {value: "Limited warranty for practical lifespan (apparel, packs)", url: "https://arcteryx.com/us/en/help/limited-warranty"}
    certifications:
      # "Arc'teryx Canada" (fetched 2026-10-24)
      - {name: bluesign, url: "https://www.bluesign.com/wp-content/uploads/2026/09/bluesign-System-Partner-list-Brands_2026.09.01.pdf"}
    as_of: 2026-10-24
    verified_by: "agent-sourced, needs teammate check"

  - name: adidas
    aliases: [adidas originals]
    certifications:
      # "adidas Germany" (fetched 2026-10-24)
      - {name: bluesign, url: "https://www.bluesign.com/wp-content/uploads/2026/09/bluesign-System-Partner-list-Brands_2026.09.01.pdf"}
