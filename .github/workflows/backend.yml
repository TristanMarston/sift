name: backend
on:
  push:
    paths: ["backend/**", "schema/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "schema/**", ".github/workflows/backend.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q   # no network, no money; model tests skip without cached weights
