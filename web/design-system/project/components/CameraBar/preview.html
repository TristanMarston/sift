<!-- @dsCard group="Camera" height=600 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CameraBar</title>
<style>
body { margin: 0; padding: 20px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 16px; }
.cam { background: var(--camera); border-radius: 24px; overflow: hidden; position: relative; }
.note { font: 13px/18px var(--font-mono); color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script>
var S = window.Sift, h = React.createElement, D = S.samples, use = React.useState, effect = React.useEffect;
function replay(label, onClick) { return h(S.Button, { variant: 'secondary', size: 'sm', onClick: onClick }, label || 'Replay'); }
function Frame(props) {
  return h('div', { className: 'cam', style: { width: 260, aspectRatio: '9 / 19' } },
    h('div', { style: { position: 'absolute', left: 0, right: 0, top: 52, aspectRatio: '3 / 4', overflow: 'hidden' } }, props.photo, props.tag ? h(S.TagFrame) : null),
    h(S.CameraBar, { mode: props.tag ? 'tag' : 'outfit', flash: props.tag ? true : undefined }));
}
function App() {
  return h('div', { className: 'row', style: { alignItems: 'flex-start', gap: 20 } },
    h(Frame, { photo: h(S.SampleOutfit) }),
    h(Frame, { tag: true, photo: h('div', { style: { width: '100%', height: '100%', background: '#3d4a63', display: 'grid', placeItems: 'center' } }, h('div', { style: { width: '42%', aspectRatio: '5 / 7', background: '#f4f2ec', borderRadius: 4, display: 'grid', placeItems: 'center', font: '10px/1.6 var(--font-mono)', color: '#2a2a2a', textAlign: 'center' } }, '50% COTTON', h('br'), '50% POLYESTER')) }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
