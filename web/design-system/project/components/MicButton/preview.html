<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MicButton</title>
<style>
body { margin: 0; padding: 20px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 16px; }
.cam { background: var(--camera); border-radius: 24px; overflow: hidden; position: relative; }
.note { font: 13px/18px var(--font-mono); color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script>
var S = window.Sift, h = React.createElement, D = S.samples, use = React.useState, effect = React.useEffect;
function replay(label, onClick) { return h(S.Button, { variant: 'secondary', size: 'sm', onClick: onClick }, label || 'Replay'); }
function App() {
  var s = use('idle');
  return h('div', { className: 'row', style: { gap: 40, padding: 12 } },
    h(S.MicButton, { state: s[0], onPressStart: function () { s[1]('listening'); }, onPressEnd: function () { s[1]('idle'); } }),
    h(S.MicButton, { state: 'listening' }),
    h(S.MicButton, { state: 'processing' }),
    h('span', { className: 'note' }, 'Hold the first one'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
