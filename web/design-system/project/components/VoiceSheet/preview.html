<!-- @dsCard group="Voice" height=340 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VoiceSheet</title>
<style>
body { margin: 0; padding: 20px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 16px; }
.cam { background: var(--camera); border-radius: 24px; overflow: hidden; position: relative; }
.note { font: 13px/18px var(--font-mono); color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script>
var S = window.Sift, h = React.createElement, D = S.samples, use = React.useState, effect = React.useEffect;
function replay(label, onClick) { return h(S.Button, { variant: 'secondary', size: 'sm', onClick: onClick }, label || 'Replay'); }
function App() {
  var p = use('listening'), k = use(0);
  effect(function () { p[1]('listening'); var a = setTimeout(function () { p[1]('transcript'); }, 1600), b = setTimeout(function () { p[1]('mapped'); }, 3200); return function () { clearTimeout(a); clearTimeout(b); }; }, [k[0]]);
  var mapped = D.utterance.mapped.map(function (m) { return Object.assign({}, m, { label: D.values.find(function (v) { return v.id === m.id; }).label }); });
  return h('div', { className: 'col', style: { maxWidth: 380 } },
    h(S.VoiceSheet, { phase: p[0], transcript: D.utterance.text, mapped: mapped }),
    h('div', null, replay('Replay', function () { k[1](k[0] + 1); })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
