<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ImpactReceipt</title>
<style>
body { margin: 0; padding: 20px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 16px; }
.cam { background: var(--camera); border-radius: 24px; overflow: hidden; position: relative; }
.note { font: 13px/18px var(--font-mono); color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script>
var S = window.Sift, h = React.createElement, D = S.samples, use = React.useState, effect = React.useEffect;
function replay(label, onClick) { return h(S.Button, { variant: 'secondary', size: 'sm', onClick: onClick }, label || 'Replay'); }
function App() {
  var p = D.teePick;
  var pick = { title: p.listing.title, source: 'Depop · small seller', price: '$18', priceNote: '$34 retail, $16 saved', materials: p.receipt.materials, co2: p.receipt.co2_saved_kg_est, water: p.receipt.water_saved_l_est, badges: p.receipt.badges };
  var yours = { title: D.yourShirt.title, source: D.yourShirt.source, materials: D.yourShirt.materials, co2: D.yourShirt.co2_kg_est, water: D.yourShirt.water_l_est, badges: D.yourShirtBadges };
  return h('div', { style: { maxWidth: 420 } }, h(S.ImpactReceipt, { yours: yours, pick: pick, stamp: 'OCT 25 · 10:42' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
