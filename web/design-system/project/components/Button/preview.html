<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
body { margin: 0; padding: 20px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 16px; }
.cam { background: var(--camera); border-radius: 24px; overflow: hidden; position: relative; }
.note { font: 13px/18px var(--font-mono); color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script>
var S = window.Sift, h = React.createElement, D = S.samples, use = React.useState, effect = React.useEffect;
function replay(label, onClick) { return h(S.Button, { variant: 'secondary', size: 'sm', onClick: onClick }, label || 'Replay'); }
function App() {
  return h('div', { className: 'col' },
    h('div', { className: 'row' }, h(S.Button, null, 'Scan an outfit'), h(S.Button, { variant: 'secondary' }, 'Retake'), h(S.Button, { variant: 'outline' }, 'Type it in'), h(S.Button, { variant: 'ghost' }, 'Cancel'), h(S.Button, { variant: 'link', size: 'sm' }, 'Upload a photo')),
    h('div', { className: 'row' }, h(S.Button, { size: 'sm', variant: 'secondary' }, 'Scan tag'), h('div', { style: { maxWidth: 300 } }, h(S.Button, { size: 'lg' }, 'Want this look with better materials?'))),
    h('div', { className: 'row cam', style: { padding: 12, borderRadius: 16 } }, h(S.Button, { variant: 'camera', size: 'sm' }, 'Type it in'), h(S.Button, { variant: 'camera' }, 'Upload a photo')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
